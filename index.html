<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبر معلوماتك | Python & Computer Basics</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;min-height:100vh;padding:24px 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:Tahoma,Arial,sans-serif;color:#edf3ff;
  background:radial-gradient(ellipse at top,#172554 0%,transparent 55%),#080d18;
}
.quiz{
  width:100%;max-width:760px;padding:clamp(18px,4vw,32px);
  border:1px solid #293954;border-radius:24px;
  background:rgba(17,27,46,.97);box-shadow:0 22px 70px #0008
}
.brand{text-align:center;margin-bottom:25px}
.brand-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:62px;height:62px;border-radius:19px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  font-size:30px;box-shadow:0 8px 25px #3b82f644;margin-bottom:12px
}
h1{font-size:clamp(23px,5vw,30px);margin:0 0 8px;color:#fff}
.subtitle{color:#9aabc5;margin:0;font-size:14px;line-height:1.8}
.stats{
  display:flex;justify-content:space-between;gap:12px;
  margin:24px 0 12px;color:#cbd5e1;font-size:14px
}
.progress-track{
  height:8px;background:#263349;border-radius:20px;
  overflow:hidden;margin-bottom:25px
}
.progress-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,#3b82f6,#a78bfa);
  border-radius:20px;transition:width .3s
}
.question-card{
  background:#111d31;border:1px solid #2c3b54;
  border-radius:17px;padding:22px;margin-bottom:18px
}
.question-label{color:#7db7ff;font-size:13px;font-weight:bold;margin-bottom:12px}
#question{
  color:#f8fafc;font-size:clamp(18px,3.5vw,21px);
  line-height:1.75;margin:0;direction:ltr;text-align:left;overflow-wrap:anywhere
}
#options{display:grid;gap:11px}
.option{
  display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px;
  border:1px solid #334155;border-radius:13px;
  background:#17243a;color:#e2e8f0;cursor:pointer;
  text-align:left;direction:ltr;font-size:15px;line-height:1.65;transition:.18s
}
.option:hover:not(:disabled){
  border-color:#60a5fa;background:#1e3150;transform:translateY(-1px)
}
.option:focus-visible,.next:focus-visible{outline:2px solid #93c5fd;outline-offset:3px}
.option:disabled{cursor:default;opacity:1}
.letter{
  flex-shrink:0;width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:9px;background:#263750;color:#bfdbfe;font-weight:bold
}
.option.correct{border-color:#22c55e;background:#123527;color:#dcfce7}
.option.correct .letter{background:#166534;color:white}
.option.wrong{border-color:#f87171;background:#3b2028;color:#fee2e2}
.option.wrong .letter{background:#991b1b;color:white}
#message{min-height:24px;font-weight:bold;text-align:center;margin:18px 0}
.next{
  display:none;width:100%;padding:15px;border:0;border-radius:13px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;font-size:16px;font-weight:bold;cursor:pointer
}
.next:hover{filter:brightness(1.12)}
.footer{text-align:center;color:#71819b;font-size:12px;margin-top:22px}
.result{text-align:center;padding:12px 0}
.result-icon{font-size:62px;margin-bottom:12px}
.result-score{font-size:clamp(30px,7vw,40px);color:#93c5fd;margin:22px 0}
.result p{color:#cbd5e1;line-height:1.9}
.result .next{display:block;margin-top:22px}
@media(max-width:480px){
  body{padding:12px 8px}
  .quiz{border-radius:18px;padding:18px 13px}
  .question-card{padding:17px}
  .option{padding:12px;font-size:14px}
}
</style>
</head>
<body>

<main class="quiz" id="quiz">
  <header class="brand">
    <div class="brand-icon">🧠</div>
    <h1>اختبر معلوماتك</h1>
    <p class="subtitle">
      أساسيات الكمبيوتر ولغة Python<br>
      ركّز في كل سؤال واختار أفضل إجابة!
    </p>
  </header>

  <div class="stats">
    <span id="progress">السؤال 1</span>
    <span id="score">النتيجة: 0</span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <section class="question-card">
    <div class="question-label">✦ السؤال الحالي</div>
    <h2 id="question"></h2>
  </section>

  <section id="options" aria-label="الاختيارات"></section>
  <p id="message" aria-live="polite"></p>

  <button class="next" id="next" type="button" onclick="nextQuestion()">
    السؤال التالي ←
  </button>

  <footer class="footer">اختبار تفاعلي • بالتوفيق 🚀</footer>
</main>

<script>
const questions = [
  {
    q: "_____ is the physical aspect of the computer that can be seen.",
    options: ["Hardware", "Software", "Operating system", "Application program"],
    answer: 0
  },
  {
    q: "_____ is the brain of a computer.",
    options: ["Hardware", "CPU", "Memory", "Disk"],
    answer: 1
  },
  {
    q: "Why do computers use zeros and ones?",
    options: [
      "Because combinations of zeros and ones can represent any numbers and characters.",
      "Because digital devices have two stable states, and it is natural to use one state for 0 and the other for 1.",
      "Because binary numbers are simplest.",
      "Because binary numbers are the bases upon which all other number systems are built."
    ],
    answer: 1
  },
  {
    q: "A computer can execute code in ____.",
    options: [
      "Machine language",
      "Assembly language",
      "High-level language",
      "None of the above"
    ],
    answer: 0
  },
  {
    q: "_____ translates a high-level language program into a machine language program.",
    options: [
      "An assembler",
      "A compiler",
      "CPU",
      "The operating system"
    ],
    answer: 1
  },
  {
    q: "Which of the following statements is true?",
    options: [
      "Python 3 is a newer version, but it is backward compatible with Python 2.",
      "Python 3 is a newer version, but it is not backward compatible with Python 2.",
      "A Python 2 program can always run on a Python 3 interpreter.",
      "A Python 3 program can always run on a Python 2 interpreter."
    ],
    answer: 1
  },
  {
    q: "To start Python from the command prompt, use the command ____.",
    options: ["execute python", "run python", "python", "go python"],
    answer: 2
  },
  {
    q: "To run a Python script file named t.py, use the command ____.",
    options: [
      "execute python t.py",
      "run python t.py",
      "python t.py",
      "go python t.py"
    ],
    answer: 2
  },
  {
    q: "Python syntax is case-sensitive.",
    options: ["True", "False"],
    answer: 0
  },
  {
    q: "Which of the following code is correct?",
    options: [
      'print("Programming is fun")\n    print("Python is fun")',
      'print("Programming is fun")\nprint("Python is fun")',
      'print("Programming is fun)\nprint("Python is fun")',
      '    print("Programming is fun)\nprint("Python is fun")'
    ],
    answer: 1
  },
  {
    q: "A Python line comment begins with ____.",
    options: ["//", "/*", "#", "$$"],
    answer: 2
  },
  {
    q: "A _____ error does not cause the program to abort, but produces incorrect results.",
    options: ["Syntax", "Runtime", "Logic"],
    answer: 2
  },
  {
    q: "In Python, a syntax error is detected by the _____ at _____.",
    options: [
      "Compiler / at compile time",
      "Interpreter / at runtime",
      "Compiler / at runtime",
      "Interpreter / at compile time"
    ],
    answer: 3
  },
  {
    q: `Which of the following code examples is correct?

I:
print("Programming is fun")
    print("Python")
print("Computer Science")

II:
print("Programming is fun")
    print("Python")
        print("Computer Science")

III:
    print("Programming is fun")
print("Python")
print("Computer Science")

IV:
print("Programming is fun")
print("Python")
print("Computer Science")`,
    options: ["I", "II", "III", "IV"],
    answer: 3
  }
];

let current = 0;
let score = 0;
let answered = false;
const letters = ["A", "B", "C", "D"];

function showQuestion() {
  answered = false;
  const item = questions[current];

  document.getElementById("progress").textContent =
    `السؤال ${current + 1} من ${questions.length}`;

  document.getElementById("score").textContent = `النتيجة: ${score}`;

  document.getElementById("progressFill").style.width =
    `${(current / questions.length) * 100}%`;

  document.getElementById("question").textContent = item.q;
  document.getElementById("message").textContent = "";

  const next = document.getElementById("next");
  next.style.display = "none";
  next.textContent = current === questions.length - 1
    ? "عرض النتيجة ←"
    : "السؤال التالي ←";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = letters[index];

    const text = document.createElement("span");
    text.textContent = option;
    text.style.whiteSpace = "pre-line";

    button.append(letter, text);
    button.onclick = () => checkAnswer(index);
    box.appendChild(button);
  });
}

function checkAnswer(index) {
  if (answered) return;
  answered = true;

  const item = questions[current];
  const buttons = document.querySelectorAll(".option");
  const message = document.getElementById("message");

  if (index === item.answer) {
    score++;
    message.textContent = "✓ إجابة صحيحة! أحسنت";
    message.style.color = "#4ade80";
  } else {
    message.textContent =
      "✕ إجابة غير صحيحة — الإجابة الصحيحة مميزة باللون الأخضر";
    message.style.color = "#f87171";
  }

  buttons.forEach((button, i) => {
    button.disabled = true;
    if (i === item.answer) {
      button.classList.add("correct");
    } else if (i === index) {
      button.classList.add("wrong");
    }
  });

  document.getElementById("score").textContent = `النتيجة: ${score}`;
  document.getElementById("next").style.display = "block";
}

function nextQuestion() {
  if (!answered) return;

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const percentage = Math.round((score / questions.length) * 100);
  let icon = "💪";
  let message = "استمر في التدريب، وهتتحسن مع كل محاولة!";

  if (percentage === 100) {
    icon = "🏆";
    message = "ممتاز! جبت الدرجة النهائية، برافو!";
  } else if (percentage >= 75) {
    icon = "🎉";
    message = "شغل ممتاز! نتيجتك قوية جدًا.";
  } else if (percentage >= 50) {
    icon = "👏";
    message = "كويس! راجع الأسئلة وحاول تاني.";
  }

  document.getElementById("quiz").innerHTML = `
    <section class="result">
      <div class="result-icon">${icon}</div>
      <h1>انتهى الاختبار!</h1>
      <p>${message}</p>
      <div class="result-score">${score} / ${questions.length}</div>
      <p>نسبتك: ${percentage}%</p>
      <button class="next" type="button" onclick="location.reload()">
        إعادة الاختبار ↻
      </button>
    </section>
    <footer class="footer">اختبار تفاعلي • استمر في التعلّم 🚀</footer>
  `;
}

showQuestion();
</script>
</body>
</html>
